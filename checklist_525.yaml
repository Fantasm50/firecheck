# Layer 2: questions of the official form (order of EMERCOM No 525 of 14.07.2026,
# registered by the Ministry of Justice 15.09.2026 No 88269).
#
# SOURCE: DOCX text of the order (Консультант-style copy, "Приказ МЧС России от 14.07.2026 N 525.docx"),
# cross-checked with the scanned PDF (document.pdf, OCR). Both agree on 27 questions and on all
# item ranges of Rules No 1479. Question wording below is shortened/translated; the official
# Russian wording is in the DOCX.
# The "2.x" sub-questions are shortened in Q525-02.
# Footnotes of the order (important, all from the DOCX):
#   - Rules No 1479 (PPR) valid until 31.12.2026 inclusive (resolution No 1479, item 2).
#   - Resolution No 1464 (AUPT/APS/SOUE requirements) valid until 01.03.2027.
#   - Order No 1173 (fire notification systems design) valid until 28.02.2029.
#   - Order No 1120 (training) valid until 01.09.2031.
# Order No 525: published 15.09.2026 (pravo.gov.ru 0001202609150018, per factcheck-report.md; not opened by us),
# entry into force 26.09.2026 by the 10-day rule (the text itself has no such item). Check on pravo.gov.ru.

form:
  order: "МЧС России от 14.07.2026 № 525"
  minjust: "15.09.2026, № 88269"
  replaces: "Приказ МЧС от 09.02.2022 № 78 и изменения (№ 1137, № 439, № 652)"
  scope_note: "п. 2 приказа: проверка не ограничивается вопросами листа"
  answers: [yes, no, not_applicable]   # 'not_applicable' needs a note
  verified: false

