# Base FMEA scores for the PRODUCTION demo set (draft v0, 2026-10-21).
#
# STATUS: author's draft (Claude) for discussion and for expert review.
#         These are NOT expert data. Do not cite as results. scored_by: draft_author.
# Scales 1-5 and their wording: fmea-scales-draft.md (sections 3-5).
# Priority rule (accepted 2026-10-20, ordering made unique 2026-10-21): group by the matrix below, S = 5 always "high";
#   inside a group: S = 5 first, then S*O desc, then S desc, then D desc, then id asc (project-spec.md, 4.5).
# Items come from requirements_production.yaml, all 69 items with demo: true (57 + GEN-004, GEN-037, HOT-006 added 2026-10-21; SYS-001...003 added 2026-11-17;
#   GEN-025 and 5 food-site items added 2026-11-21).
#
# Origin of scores (field "from"):
#   warehouse - copied unchanged from scores_warehouse_draft.yaml (46 items, shared GEN/TER/HEAT/HOT/INS/EXT/DOC ids).
#               O there was set for a typical small warehouse: re-check for a workshop with experts.
#   new       - scored for this file (14 items: GEN-008, GEN-017, GEN-021, 8 PROD items; GEN-004, GEN-037, HOT-006 on 2026-10-21; SYS-001...003 on 2026-11-17;
#               GEN-025, GEN-038, PROD-012, PROD-013, HEAT-003, HEAT-004 on 2026-11-21).
# O is the base value for a typical small workshop; the specialist may raise it by 1
#   if the violation is massive or permanent (rule in project-spec.md, 4.4).

meta:
  object_type: production
  scale: "1-5"
  scored_by: draft_author
  status: draft
  items_count: 69
  excluded: {}

# Priority group by S (rows) and O (columns 1..5). H = high, M = medium, L = low.
# Same table as for the warehouse. To be approved by experts.
priority_matrix:
  5: [H, H, H, H, H]
  4: [M, M, H, H, H]
  3: [L, M, M, H, H]
  2: [L, L, L, M, M]
  1: [L, L, L, L, L]

# s, o, d and a one-line rationale. Rationale explains the choice of level, not a source.
scores:
