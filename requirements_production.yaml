  # ---------- Equipment with fire protection systems (question 2.9-2.10 of the form; added 2026-11-17) ----------
  # Source: resolution No 1464 of 01.09.2021 (valid until 01.03.2027), text from GARANT,
  # sources/pp-1464-2021-09-01.odt (edition not stated: check on pravo.gov.ru).
