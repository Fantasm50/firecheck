# Layer 1: checkable fire safety requirements for a PRODUCTION object (prototype scope).
#
# SOURCE: Rules of fire safety regime (PPR), Government resolution No 1479 of 16.09.2020,
#         consolidated edition of 03.02.2025 (ConsultantPlus, saved 06.02.2026, docx);
#         cross-checked with the 2023 edition (pdf) and with resolution No 90 (pdf scan).
#         Items touched by No 90 carry the "amended" field.
# Wording of "check" is a short paraphrase of the cited item, written for a specialist's checklist.
# "verified: true" means: the item exists in this edition with this meaning.
#
# IMPORTANT BEFORE USE:
#   1. Verified on 2026-10-10 against the consolidated ConsultantPlus text "ред. от 03.02.2025"
#      (saved 06.02.2026, last amending act: resolution No 90). Items touched by No 90 carry "amended".
#      Newer amendments after 06.02.2026 are not covered: check the date of the latest edition before use.
#   2. PPR No 1479 is valid until 31.12.2026 inclusive (footnote of order No 525).
#   3. FMEA scores (s / o / d) are kept in a separate file: scores_production_draft.yaml.
#   4. Items of PPR section IX (121-166) are mostly industry-specific (matches, wood boards,
#      power plants, printing). Only the general ones (121, 122, 124, 125, 129-132, 134) are used here.
#   5. Section XVI (337-372): only items 354-363 (hot works) were read; 366-372 not included yet.
#
# Fields:
#   q525      - question of the official form (see checklist_525.yaml)
#   condition - when the item applies (null = always)
#   periodic  - required period from the text, if any
#   applies_if - machine condition for the questionnaire (project-spec.md, 4.1): the item applies
#               if ANY listed flag is true. Only demo items have it (added 2026-10-21).
#               Derived flags computed in code: many_people = people_max >= 50 or workplaces_per_floor >= 10;
#               mass_people = people_max >= 50 (item 5: 50+ people at the same time);
#               no_water_no_aupt = not has_indoor_hydrants and not has_aupt and water_required != "no" (item 410 exception);
#               aps_missing / soue_missing / aupt_missing = system is absent and <system>_required != "no" (SYS-*, 2026-11-17).
#   note      - hint for the specialist, shown next to the item.
#   changelog - service record (what was changed and why); never shown to the specialist.

meta:
  source: "ППР, постановление Правительства РФ от 16.09.2020 № 1479"
  edition: "ред. от 03.02.2025 (пост. № 90, в силу с 01.09.2025), сводный текст КонсультантПлюс от 06.02.2026"
  object_type: production
  items_count: 73      # 65 PPR items + 5 documents (DOC-*) + 3 systems (SYS-*, 2026-11-17); GEN-037 and HOT-006 added 2026-10-21
  demo_count: 63       # demo: true; 10 items deferred with defer_reason (2026-10-21: +GEN-004, +GEN-037, +HOT-006; 2026-11-17: +SYS-001...003)
  # Last day each act behind the items is in force (added 2026-11-18, core/validity.py).
  # items: "ppr" = items with the ppr field; any other text = items whose "source" contains it.
  # The app and the report warn 30 days before last_day and after it.
  validity:
    - act: "ППР (пост. Правительства РФ № 1479)"
      last_day: 2026-12-31
      items: ppr
      basis: "п. 2 пост. № 1479: действует до 31 декабря 2026 г. включительно (сноска <1> приказа МЧС № 525)"
    - act: "пост. Правительства РФ № 1464"
      last_day: 2027-02-28
      items: "№ 1464"
      basis: "п. 2 пост. № 1464: действует до 1 марта 2027 г. (сноска <4> приказа МЧС № 525); последним днём принято 28.02.2027 — осторожное прочтение «до»"

requirements:
  # ---------- General regime, training, documents (items 1-64) ----------
  - {id: GEN-001, ppr: "2",   q525: Q525-04, topic: instructions,  condition: null, check: "Для каждого здания или группы однотипных зданий руководителем организации утверждена инструкция о мерах пожарной безопасности", verified: true, demo: true}
  - {id: GEN-002, ppr: "3",   q525: Q525-04, topic: training,      condition: null, check: "Лица допускаются к работе только после обучения мерам пожарной безопасности (противопожарный инструктаж или ДПП)", verified: true, demo: true}
  - {id: GEN-003, ppr: "5",   q525: Q525-04, topic: evacuation,    condition: "50+ человек в здании или 10+ постоянных рабочих мест на этаже", applies_if: [many_people], check: "Разработаны планы эвакуации людей при пожаре и размещены на видных местах", verified: true, demo: true}
  - {id: GEN-004, ppr: "9",   q525: Q525-04, topic: training,      condition: "объект с массовым пребыванием людей (50+)", applies_if: [mass_people], periodic: "не реже 1 раза в полугодие", check: "Проводятся практические тренировки по эвакуации не реже 1 раза в полугодие", changelog: "Возвращён в демо 2026-10-21 (кейс Б, средний объект)", verified: true, demo: true}
  - {id: GEN-005, ppr: "10",  q525: Q525-04, topic: fire_alarm,    condition: "есть приёмно-контрольные приборы пожарные", check: "У приёмно-контрольных приборов размещён перечень защищаемых помещений (для безадресных систем — группа помещений)", verified: true, demo: false, defer_reason: "мелкая формальность (табличка у прибора), низкий вес"}
  - {id: GEN-006, ppr: "11",  q525: Q525-04, topic: smoking,       condition: null, check: "На складах, участках переработки и хранения ЛВЖ, ГЖ и горючих газов, взрывопожароопасных и пожароопасных участках курение только в специально отведённых местах; на объекте размещены знаки «Курение и пользование открытым огнём запрещено», места курения обозначены знаком «Место курения»", changelog: "Уточнено 2026-10-21 по тексту п. 11: запрет курения в ППР относится к перечисленным объектам, знаки — ко всем", verified: true, demo: true}
  - {id: GEN-007, ppr: "12",  q525: Q525-04, topic: categories,    condition: null, check: "Проведено категорирование помещений и наружных установок по взрывопожарной и пожарной опасности, определены классы зон; категории обозначены на входных дверях (кроме категории Д)", verified: true, demo: true}
  - {id: GEN-008, ppr: "13",  q525: Q525-04, topic: fire_resistance, condition: "применяется огнезащита конструкций", applies_if: [has_fire_retardant], periodic: "не реже 1 раза в год, если иное не указано в документации", amended: "пост. № 90 от 03.02.2025 (абз. 4)", check: "Проверяется состояние огнезащитного покрытия с актом (протоколом); повреждения устранены; по окончании гарантийного срока — повторная обработка либо ежегодные испытания (обоснование расчётом)", verified: true, demo: true}
  - {id: GEN-009, ppr: "14",  q525: Q525-04, topic: fire_doors,    condition: null, check: "Противопожарные двери исправны (самозакрывание, ручки, «антипаника», замки, уплотнения, пороги); на дверях лестничных клеток и эвакуационных выходов, в том числе из подвала на первый этаж, есть приспособления для самозакрывания (кроме дверей, ведущих в квартиры, коридоры, вестибюли (фойе) и непосредственно наружу); ничто не мешает закрыванию противопожарных и противодымных дверей", verified: true, demo: true}
  - {id: GEN-010, ppr: "15",  q525: Q525-04, topic: fire_barriers, condition: null, check: "Отверстия и зазоры в местах пересечения противопожарных преград коммуникациями заделаны негорючими материалами", verified: true, demo: false, defer_reason: "требует вскрытия конструкций и подтверждения огнестойкости, специалист ответит неуверенно"}
