  - {id: GEN-012, ppr: "16 б", q525: Q525-04, topic: storage_rules, condition: null, amended: "пост. № 90 от 03.02.2025", check: "Чердаки, технические, подвальные, подземные и цокольные этажи, подполья, вентиляционные камеры и другие технические помещения не используются для производственных участков и мастерских, а также для хранения и применения ЛВЖ и ГЖ, пороха, ВВ, пиротехники, баллонов с горючими газами, аэрозолей, пожаровзрывоопасных веществ, отходов любых классов опасности, продукции, оборудования, мебели и других предметов (кроме случаев, установленных нормативными документами по пожарной безопасности)", changelog: "Дописано 2026-10-21 по тексту п. 16 б (review-scales.md)", verified: true, demo: true}
