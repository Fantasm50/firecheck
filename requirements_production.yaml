  - {id: SYS-001, ppr: null, source: "пост. № 1464, п. 3, прил. 1 и 3; приказ № 525, вопрос 2.9", q525: Q525-02, topic: systems_required, condition: "АПС нет, а по нормам она нужна или это неизвестно", applies_if: [aps_missing], check: "Здание оснащено автоматической пожарной сигнализацией, если она требуется по нормам", note: "Нужна ли АПС, зависит от категории и площади помещений (пост. № 1464, прил. 1 и 3, для зданий, введённых до вступления в силу 123-ФЗ; для более новых — проектная документация). Помещения категорий В4 и Д, с мокрыми процессами, лестничные клетки не оснащаются (п. 5). Помещения класса Ф5 с АУПТ допускается не оснащать АПС при обеспечении безопасной эвакуации (п. 11). Если АПС по нормам не нужна, ответьте «не применимо» и укажите основание", changelog: "2026-11-17: закрыта слепая зона обязательного оснащения (review-expert-panel-2026-11-17.md §5); сверено с текстом пост. № 1464 и приказа № 525", verified: true, demo: true}
  - {id: SYS-002, ppr: null, source: "пост. № 1464, п. 8, прил. 5; приказ № 525, вопрос 2.10", q525: Q525-02, topic: systems_required, condition: "СОУЭ нет, а по нормам она нужна или это неизвестно", applies_if: [soue_missing], check: "Здание оснащено системой оповещения и управления эвакуацией людей при пожаре, если она требуется по нормам", note: "Производственным и складским зданиям категорий А–Д СОУЭ требуется (пост. № 1464, прил. 5, п. 21). Исключение — одноэтажное здание из одного помещения категорий В4, Г или Д площадью не более 50 м² без постоянных рабочих мест (прим. 6). Если СОУЭ по нормам не нужна, ответьте «не применимо» и укажите основание", changelog: "2026-11-17: закрыта слепая зона обязательного оснащения; привязка к вопросу 2.10 («иные системы противопожарной защиты») — наша трактовка, сверить", verified: true, demo: true}
  - {id: SYS-003, ppr: null, source: "пост. № 1464, п. 3, 10, прил. 1, 3 и 4; приказ № 525, вопрос 2.9", q525: Q525-02, topic: systems_required, condition: "АУПТ нет, а по нормам она нужна или это неизвестно", applies_if: [aupt_missing], check: "Здание оснащено автоматической установкой пожаротушения, если она требуется по нормам", note: "Нужна ли АУПТ, зависит от категории и площади помещений (пост. № 1464, прил. 1, 3 и 4, для зданий, введённых до вступления в силу 123-ФЗ; для более новых — проектная документация). АУПТ можно не устанавливать при выполнении условия соответствия по 123-ФЗ или при обеспечении безопасной эвакуации людей (п. 10). Если АУПТ по нормам не нужна, ответьте «не применимо» и укажите основание", changelog: "2026-11-17: закрыта слепая зона обязательного оснащения; сверено с текстом пост. № 1464 и приказа № 525", verified: true, demo: true}

