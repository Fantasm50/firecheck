  - {id: GEN-024, s: 5, o: 2, d: 2, why: "закрыты оповещатели, знаки, не работает эвакуационное освещение"}
  - {id: GEN-034, s: 5, o: 2, d: 3, why: "АПС/СОУЭ/АУПТ отключены или на ручном: нет обнаружения и оповещения; видно по пульту и журналу"}
