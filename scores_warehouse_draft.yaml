# Base FMEA scores for the WAREHOUSE demo set (draft v0, 2026-10-20).
#
# STATUS: author's draft (Claude) for discussion and for expert review.
#         These are NOT expert data. Do not cite as results. scored_by: draft_author.
# Scales 1-5 and their wording: fmea-scales-draft.md (sections 3-5).
# Priority rule (accepted 2026-10-20): group by S and O (matrix below), S = 5 always "high";
#   inside a group S = 5 items go first, then S*O desc, then S desc, then D desc (hidden first), then id asc; RPN = S*O*D kept for research.
#   (2026-10-21: q525 key replaced by "S desc" and "id asc", see project-spec.md 4.5.)
# Items come from requirements_warehouse.yaml (WH-*) and requirements_production.yaml (reused ids).
# O here is the base value for a typical small warehouse; the specialist may raise it by 1
#   if the violation is massive or permanent (rule to be described in the questionnaire).

meta:
  object_type: warehouse
  scale: "1-5"
  scored_by: draft_author
  status: draft
  excluded:
    GEN-021: "для склада заменён более строгим WH-008 (п. 293); оценивать один раз"

# Priority group by S (rows) and O (columns 1..5). H = high, M = medium, L = low.
# Logic: S = 5 -> always H; S*O >= 12 -> H; severity floor: S = 4 never below M;
#        S <= 2 with O <= 3 -> L; S = 1 -> L. To be approved by experts.
priority_matrix:
  5: [H, H, H, H, H]
  4: [M, M, H, H, H]
  3: [L, M, M, H, H]
  2: [L, L, L, M, M]
  1: [L, L, L, L, L]

# s, o, d and a one-line rationale. Rationale explains the choice of level, not a source.
scores:
